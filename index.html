const GROUPS = [
  {id:"all", name:"Tất cả", cats:null},
  {id:"g-main", name:"🍜 Bữa chính", cats:["bunbo","hen","banhcanh","bunlong","com","banh"]},
  {id:"g-snack", name:"🍢 Ăn vặt & ốc", cats:["anvat","nemlui","banhmi","oc"]},
  {id:"g-sweet", name:"🍧 Chè & cà phê", cats:["che","cafe"]},
];
const inSel = (sel, catId) => { if (sel==="all") return true; const g = GROUPS.find(g=>g.id===sel); return g ? g.cats.includes(catId) : sel===catId; };

const DAYS = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };

function hueNow(){
  const parts = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Ho_Chi_Minh",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t).value;
  const day = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(get("weekday"));
  return {day, min: Number(get("hour"))*60 + Number(get("minute"))};
}

// mỗi ngày: null | "24h" | [mở, đóng] | [[mở, đóng], [mở, đóng]] (bán 2 ca)
const ranges = t => !t || t==="24h" ? [] : Array.isArray(t[0]) ? t : [t];
function isOpen(hours, now){
  const t = hours[now.day];
  if (t === "24h") return true;
  for (const [a,b] of ranges(t)){ const o=toMin(a), c=toMin(b);
    if (c > o ? (now.min>=o && now.min<c) : (now.min>=o)) return true; }
  // ca hôm qua kéo qua nửa đêm
  for (const [a,b] of ranges(hours[(now.day+6)%7])){ const o=toMin(a), c=toMin(b);
    if (c<=o && now.min<c) return true; }
  return false;
}
const fmt = t => t===null ? "Nghỉ" : t==="24h" ? "Mở cả ngày" : ranges(t).map(([a,b])=>`${a} – ${b==="24:00"?"00:00":b}`).join(", ");
const mapsUrl = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+", "+p.a+", Huế")}&query_place_id=${p.pid}`;

function Card({p, now}){
  const [week, setWeek] = useState(false);
  const open = isOpen(p.h, now);
  return e("article",{className:"card"},
    e("h3",null,p.n),
    e("div",{className:"meta"},
      e("span",{className:"pill "+(open?"open":"closed")}, open?"Đang mở":"Đang đóng"),
      e("span",{className:"star"},"★ "+p.r.toFixed(1)),
      e("span",null,p.c.toLocaleString("vi-VN")+" đánh giá")),
    e("p",{className:"addr"},p.a),
    e("p",{className:"note"},p.note),
    e("div",{className:"meta"}, p.tags.map(t=>e("span",{key:t,className:"tag"},t))),
    e("div",{className:"hours"},
      "Hôm nay: ", e("strong",null,fmt(p.h[now.day])), " · ",
      e("button",{className:"more",onClick:()=>setWeek(!week),"aria-expanded":week}, week?"Ẩn lịch tuần":"Cả tuần")),
    week && e("table",{className:"week"}, e("tbody",null,
      [1,2,3,4,5,6,0].map(d=>e("tr",{key:d,className:d===now.day?"today":""},
        e("td",null,DAYS[d]), e("td",null,fmt(p.h[d])))))),
    e("div",{className:"actions"},
      e("a",{className:"btn",href:mapsUrl(p),target:"_blank",rel:"noopener"},"Mở Google Maps ↗"))
  );
}

function Weather(){
  const today = hueToday();
  const days = FORECAST.filter(d=>d.date>=today);
  const [sel, setSel] = useState(days[0] && days[0].date);
  const cur = days.find(d=>d.date===sel) || days[0];
  const [open, setOpen] = useState(()=>{ try{ return window.matchMedia("(min-width:721px)").matches; }catch(_){ return true; } });
  const last = FORECAST[FORECAST.length-1].date.split("-").map(Number);
  return e("aside",{className:"wx","aria-label":"Thời tiết Huế"},
    e("div",{className:"wx-head"},
      e("h2",null,"Thời tiết Huế"),
      e("span",{className:"upd"},"Dự báo cập nhật 29/10")),
    days.length===0
      ? e("p",{className:"later"},"Dự báo trong trang đã cũ. Nhắn anh cập nhật lại nhé.")
      : e(React.Fragment,null,
          e(Pick,{d:cur, today}),
          e("div",{className:"strip",role:"group","aria-label":"Chọn ngày"}, days.map(d=>{
            const L = dayLabel(d.date, today);
            return e("button",{key:d.date,type:"button",className:"day","aria-pressed":d.date===cur.date,onClick:()=>setSel(d.date)},
              e("div",{className:"d"}, e("b",null,L.short), L.dm),
              e("div",{className:"ic","aria-hidden":"true"}, icon(d.rain)),
              e("div",{className:"t"}, d.hi+"°", e("span",null," "+d.lo+"°")),
              e("div",{className:"rain","aria-label":"Mức mưa "+d.rain+" trên 3"}, [1,2,3].map(i=>e("i",{key:i,className:i<=d.rain?"on":""}))));
          })),
          e("p",{className:"hint"},"Vuốt ngang để xem thêm ngày, chạm vào một ngày để đọc lời nhắn.")),
    e("details",{className:"more-wx",open,onToggle:ev=>setOpen(ev.currentTarget.open)},
      e("summary",null,"Khí hậu tháng 11 & mẹo đi ăn mùa mưa"),
      e("div",{className:"more-body"},
        e("div",null,
          e("p",{className:"lead"},"Mùa mưa, trời se lạnh, hay có mưa phùn. Đúng lúc để ngồi bên tô bún bò nóng hay chén chè gừng đấy em."),
          e("div",{className:"stats"},
            e("div",{className:"stat"},e("b",null,"21–26°"),e("span",null,"Thấp – cao trung bình")),
            e("div",{className:"stat"},e("b",null,"~445 mm"),e("span",null,"Mưa cả tháng")),
            e("div",{className:"stat"},e("b",null,"#2"),e("span",null,"Tháng mưa nhiều nhất, sau tháng 10")))),
        e("div",null,
          e("h3",null,"Dự báo năm nay"),
          e("ul",null,
            e("li",null,"30/10 mưa to, 31/10 còn mưa rào và dông. 1–2/11 tạm ngớt mưa, sau đó mưa rào quay lại."),
            e("li",null,"Cả tháng 11: tổng lượng mưa nhiều nơi thấp hơn trung bình 20–40%, nhưng mưa to vẫn tập trung ở Trung Bộ."),
            e("li",null,`Sau ${last[2]}/${last[1]} chưa có dự báo đáng tin. Nửa cuối tháng 11 thường mát hơn, vẫn có những đợt mưa dài.`)),
          e("h3",null,"Mẹo đi ăn mùa mưa"),
          e("ul",null,

            e("a",{href:"https://nchmf.gov.vn/kttvsite/vi-VN/1/thuan-hoa-tp-hue-w7.html",target:"_blank",rel:"noopener"},"Trung tâm Dự báo KTTV quốc gia"),
            "; xu thế tháng 11 qua ",
            e("a",{href:"https://congdankhuyenhoc.vn/thoi-tiet-thang-11-2026-mua-thap-hon-trung-binh-nhieu-nam-179261024093344547.htm",target:"_blank",rel:"noopener"},"Công dân & Khuyến học"),

function Pick({d, today}){
  const L = dayLabel(d.date, today);
  return e("div",{className:"pick","aria-live":"polite"},
    e("div",{className:"big","aria-hidden":"true"}, icon(d.rain)),
    e("div",{className:"when"}, L.long+" · "+L.dm+" ", e("span",null,"· "+d.c+" · ", e("span",{className:"nw"}, d.lo+"–"+d.hi+"°"))),
    e("p",{className:"msg"}, dayMsg(d), " ", e("span",{className:"kao","aria-hidden":"true"}, KAO[d.rain])));
}

// rain: 0 không mưa, 1 mưa rào/nhẹ, 2 mưa rào có dông, 3 mưa to
const FORECAST = [
  {date:"2026-10-30", lo:22, hi:27, c:"Mưa to", rain:3},

  {date:"2026-11-01", lo:23, hi:30, c:"Nhiều mây, không mưa", rain:0},
  {date:"2026-11-02", lo:22, hi:32, c:"Nhiều mây, không mưa", rain:0},
  {date:"2026-11-03", lo:22, hi:30, c:"Mưa rào", rain:1},
  {date:"2026-11-04", lo:24, hi:27, c:"Mưa rào, có dông", rain:2},
  {date:"2026-11-05", lo:23, hi:28, c:"Mưa rào", rain:1},
  {date:"2026-11-06", lo:23, hi:31, c:"Mưa rào", rain:1},
  {date:"2026-11-07", lo:23, hi:30, c:"Nhiều mây, không mưa", rain:0},
  {date:"2026-11-08", lo:23, hi:30, c:"Nhiều mây, không mưa", rain:0},
];
const DOW = ["CN","T2","T3","T4","T5","T6","T7"];
const DOW_LONG = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
function dayLabel(date, today){
  const [y,m,dd] = date.split("-").map(Number), [ty,tm,td] = today.split("-").map(Number);
  const w = new Date(Date.UTC(y,m-1,dd)).getUTCDay();
  const diff = Math.round((Date.UTC(y,m-1,dd) - Date.UTC(ty,tm-1,td)) / 864e5);
  return { dm: dd+"/"+m,
    short: diff===0 ? "Nay" : diff===1 ? "Mai" : DOW[w],
    long:  diff===0 ? "Hôm nay" : diff===1 ? "Ngày mai" : DOW_LONG[w] };
}
// Lời nhắn cho em theo mức mưa; đêm xuống 23° trở xuống là trời se lạnh
const ICONS = {3:"⛈️", 2:"☔", 1:"🌦️", 0:"⛅"};
const KAO = {3:"( ´•̥̥̥ω•̥̥̥` )", 2:"(ノ﹏ヽ)", 1:"(˶ᵔ ᵕ ᵔ˶)", 0:"٩(◕‿◕)۶"};
const icon = r => ICONS[r];
function dayMsg(d){
  const cold = d.lo <= 23;
  if (d.rain >= 2) return (d.rain===3 ? "Nay mưa to lắm đó em. " : "Nay mưa đó em. ") + "Nhớ mang theo ô và áo khoác để tránh cảm nhé!";
  if (d.rain === 1) return "Nay mưa nhẹ thôi, em có thể đi chơi thoải mái nhá." + (cold ? " Tối se lạnh, khoác thêm áo nha." : "");
  return "Nay không mưa, đi chơi thôi em ơi!" + (cold ? " Tối lạnh nhớ mang áo khoác nhé." : "");
}
function hueToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh"}).format(new Date()); }

function App(){
  const [now, setNow] = useState(hueNow());
  const [cat, setCat] = useState(()=>{ try{return localStorage.getItem("hue-cat")||"all"}catch(_){return "all"} });
  const [q, setQ] = useState("");
  const [onlyOpen, setOnlyOpen] = useState(false);
  useEffect(()=>{ const t=setInterval(()=>setNow(hueNow()),60000); return ()=>clearInterval(t); },[]);
  useEffect(()=>{ try{localStorage.setItem("hue-cat",cat)}catch(_){} },[cat]);

  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase();
  const shown = useMemo(()=>CATS
    .filter(c=>inSel(cat, c.id))
    .map(c=>({...c, places:c.places.filter(p=>
      (!q || norm(p.n+" "+p.a+" "+p.note+" "+p.tags.join(" ")).includes(norm(q))) &&
      (!onlyOpen || isOpen(p.h, now)))}))
    .filter(c=>c.places.length), [cat,q,onlyOpen,now]);

  const total = CATS.reduce((s,c)=>s+c.places.length,0);
  const hh = String(Math.floor(now.min/60)).padStart(2,"0"), mm = String(now.min%60).padStart(2,"0");

  return e("div",{className:"wrap"},
    e("header",null,
      e("div",{className:"clock"},`Giờ Huế · ${DAYS[now.day]} ${hh}:${mm}`),
      e("h1",null,"Ăn Gì Ở Huế"),
      e("p",{className:"sub"},`Hello em, có lẽ em đang đói bụng rồi đúng không? Đừng lo, Huế không vội, nên ăn ở Huế cũng chẳng cần vội. ${total} quán nhỏ trong trang này được anh và những người bạn thương Huế góp nhặt dần, từ tô bún bò bốc khói lúc sáng sớm, chén cơm hến cay xé lưỡi bên cồn Hến, đến ly cà phê muối ngồi ngắm sông Hương trôi. Mong em ghé đâu cũng thấy ấm lòng, và mang về một chút vị Huế để nhớ.`)),
    e(Weather),
    e("div",{className:"bar"},
      e("div",{className:"groups",role:"group","aria-label":"Chọn nhóm"},
        GROUPS.map(g=>e("button",{key:g.id,className:"grp","aria-pressed":cat===g.id,onClick:()=>setCat(g.id)},g.name))),
      e("div",{className:"chips",role:"group","aria-label":"Chọn món"},
        CATS.map(c=>{ const n=c.places.length; return e("button",{key:c.id,className:"chip","aria-pressed":cat===c.id,onClick:()=>setCat(cat===c.id?"all":c.id)},c.name+" · "+n); })),
      e("div",{className:"row"},
        e("input",{id:"q",type:"search",placeholder:"Tìm quán, đường, món…",value:q,onChange:ev=>setQ(ev.target.value),"aria-label":"Tìm kiếm"}),
        e("label",{className:"toggle"},
          e("input",{id:"open",type:"checkbox",checked:onlyOpen,onChange:ev=>setOnlyOpen(ev.target.checked)}),
          "Chỉ quán đang mở"))),
    shown.length===0
      ? e("p",{className:"empty"},"Không có quán nào khớp. Thử bỏ bộ lọc \"Chỉ quán đang mở\" hoặc đổi từ khóa.")
      : shown.map(c=>e("section",{key:c.id},
          e("h2",null,c.name,e("small",null,c.places.length+" quán")),
          e("p",{className:"intro"},c.intro),
          e("div",{className:"grid"},c.places.map(p=>e(Card,{key:p.pid,p,now}))))),
    e("footer",null,"Dữ liệu lấy từ Google Maps ngày 26/10/2026. Giờ mở cửa và giá có thể đã thay đổi, nhất là quán vỉa hè. Review trên Google thiên về khách du lịch, nên hỏi thêm người Huế nếu có thể.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
